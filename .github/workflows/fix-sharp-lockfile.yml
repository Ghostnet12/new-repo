name: Refresh Sharp lockfile

on:
  push:
    branches: [fix-sharp-lockfile]
    paths:
      - '.github/workflows/fix-sharp-lockfile.yml'
      - 'package.json'

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify frozen install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
          else
            git commit -m 'Lock Sharp image dependency [lockfile-ready]'
            git push origin HEAD:fix-sharp-lockfile
          fi
