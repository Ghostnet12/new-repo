name: Import 4K Shadow Deck card assets

on:
  push:
    branches:
      - asset-refresh-4k
    paths:
      - 'asset-source/ASSET_URL.txt'
      - '.github/workflows/import-4k-card-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    if: ${{ !contains(github.event.head_commit.message, '[imported-4k-assets]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read asset package URL
        id: url
        shell: bash
        run: |
          URL="$(tr -d '\r\n ' < asset-source/ASSET_URL.txt)"
          if [ -z "$URL" ] || [[ "$URL" == \#* ]]; then
            echo 'Asset URL is not configured.'
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Try direct package download
        id: direct
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.url.outputs.url }}'
          curl --fail --location --retry 3 --output /tmp/download.bin "$URL"
          unzip -tqq /tmp/download.bin >/dev/null 2>&1
          mv /tmp/download.bin /tmp/shadow-cards.zip

      - name: Download package through firestorage browser flow
        if: steps.direct.outcome != 'success'
        shell: bash
        env:
          SHARE_URL: ${{ steps.url.outputs.url }}
        run: |
          set -euo pipefail
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.57.0
          npx playwright install --with-deps chromium >/dev/null
          cat > /tmp/firestorage-download.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const url = process.env.SHARE_URL;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ acceptDownloads: true, locale: 'ja-JP' });
          const page = await context.newPage();

          page.on('response', response => {
            const u = response.url();
            if (/api|download|file|share/i.test(u)) console.log('response', response.status(), u);
          });

          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(7000);
          console.log('page title:', await page.title());
          console.log('controls:', (await page.locator('button,a').allTextContents()).join(' | '));

          const locator = page.locator('button, a').filter({ hasText: /ダウンロード|download/i });
          const count = await locator.count();
          let target = null;
          for (let i = 0; i < count; i++) {
            const item = locator.nth(i);
            if (await item.isVisible().catch(() => false)) { target = item; break; }
          }
          if (!target) {
            console.log((await page.locator('body').innerText()).slice(0, 12000));
            throw new Error('Could not find the firestorage download control');
          }

          const downloadPromise = page.waitForEvent('download', { timeout: 120000 });
          await target.click();
          const download = await downloadPromise;
          await download.saveAs('/tmp/shadow-cards.zip');
          console.log('downloaded:', download.suggestedFilename());
          await browser.close();
          if (!fs.existsSync('/tmp/shadow-cards.zip')) throw new Error('Download file missing');
          JS
          node /tmp/firestorage-download.mjs
          unzip -tqq /tmp/shadow-cards.zip

      - name: Extract cards
        run: |
          set -euo pipefail
          rm -rf client/public/assets/cards
          mkdir -p client/public/assets/cards
          unzip -j /tmp/shadow-cards.zip 'client/public/assets/cards/*.webp' -d client/public/assets/cards
          COUNT="$(find client/public/assets/cards -maxdepth 1 -name '*.webp' | wc -l | tr -d ' ')"
          test "$COUNT" = '78' || { echo "Expected 78 cards, got $COUNT"; exit 1; }
          for I in $(seq -w 0 77); do
            test -s "client/public/assets/cards/$I.webp" || { echo "Missing $I.webp"; exit 1; }
          done
          du -sh client/public/assets/cards

      - name: Commit individual 4K assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f client/public/assets/cards
          if git diff --cached --quiet; then
            echo 'Assets already current.'
          else
            git commit -m 'Import 78 individual 4K Shadow Deck card assets [imported-4k-assets]'
            git push origin HEAD:asset-refresh-4k
          fi
