name: Materialize individual Shadow Deck card assets

on:
  push:
    branches:
      - asset-refresh-4k
    paths:
      - 'asset-source/shadow_cards_web_320.zip'
      - '.github/workflows/materialize-card-assets.yml'
      - 'scripts/verify-card-assets.mjs'

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized-assets]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract individual card files
        run: |
          rm -rf client/public/assets/cards
          unzip -q asset-source/shadow_cards_web_320.zip -d .
      - name: Verify exact 78-card set
        run: node scripts/verify-card-assets.mjs
      - name: Commit materialized assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/public/assets/cards
          if git diff --cached --quiet; then
            echo 'Card assets already current.'
          else
            git commit -m 'Materialize 78 individual Shadow Deck card assets [materialized-assets]'
            git push origin HEAD:asset-refresh-4k
          fi
