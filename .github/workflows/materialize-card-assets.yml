name: Materialize Shadow Deck card assets

on:
  push:
    branches:
      - asset-refresh-4k
    paths:
      - 'asset-source/shadow78_transport.part*.b64'

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized-assets]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Reassemble source image
        run: |
          cat asset-source/shadow78_transport.part*.b64 | tr -d '\n\r ' | base64 --decode > asset-source/shadow78_transport.webp
      - name: Create individual card assets
        run: python scripts/materialize_card_assets.py
      - name: Commit generated card files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/public/assets/cards
          if git diff --cached --quiet; then
            echo 'Card assets already current.'
          else
            git commit -m 'Materialize 78 individual Shadow Deck card assets [materialized-assets]'
            git push origin HEAD:asset-refresh-4k
          fi
