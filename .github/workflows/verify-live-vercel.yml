name: Verify live Shadow Deck on Vercel

on:
  push:
    branches: [verify-vercel-live]
    paths: ['.github/workflows/verify-live-vercel.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production homepage
        shell: bash
        run: |
          set -euo pipefail
          URL='https://fracture-shadow-deck-mern-v2-ghostnet1.vercel.app'
          OK=0
          for I in $(seq 1 36); do
            CODE="$(curl -L -sS -o /tmp/home.html -w '%{http_code}' "$URL/" || true)"
            echo "homepage attempt $I: HTTP $CODE"
            if [ "$CODE" = '200' ]; then OK=1; break; fi
            sleep 10
          done
          test "$OK" = '1'
          grep -Eiq 'FRACTURE|Shadow Deck|The Complete 78' /tmp/home.html
          echo 'Homepage is live.'

      - name: Verify MERN API
        shell: bash
        run: |
          set -euo pipefail
          URL='https://fracture-shadow-deck-mern-v2-ghostnet1.vercel.app'
          curl -L --fail --silent --show-error "$URL/api/health" | tee /tmp/health.json
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));if(h.status!=='ok')process.exit(1);console.log('API health:',h.status,'stack:',h.stack,'db:',h.database)"

      - name: Verify responsive card asset
        shell: bash
        run: |
          set -euo pipefail
          URL='https://fracture-shadow-deck-mern-v2-ghostnet1.vercel.app'
          curl -L --fail --silent --show-error "$URL/assets/cards/web/00.webp" -o /tmp/card.webp
          test "$(wc -c < /tmp/card.webp)" -gt 10000
          file /tmp/card.webp
          echo "Responsive card bytes: $(wc -c < /tmp/card.webp)"

      - name: Verify deck endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL='https://fracture-shadow-deck-mern-v2-ghostnet1.vercel.app'
          curl -L --fail --silent --show-error "$URL/api/deck" -o /tmp/deck.json
          node -e "const d=require('/tmp/deck.json');if(d.cards?.length!==78){console.error('cards',d.cards?.length);process.exit(1)}console.log('Live deck cards:',d.cards.length)"
